# Her push ve pull request'te: tip kontrolü, lint, testler, üretim derlemesi.
# GTFS ve OSRM verisi CI'da yok; gerçek İstanbul verisi isteyen test kendiliğinden
# atlanır, diğer testler yapay veriyle çalışır.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Testler
        run: npm test

      - name: Üretim derlemesi
        run: npm run build
